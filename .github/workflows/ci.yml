name: python CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}

      - name: test application
        run: make test_ci

  ci-passed:
    name: CI passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required job finished with '${result}'"
              exit 1
            fi
          done
